---
- name: Setup Fedora 44 developer workstation
  hosts: local
  gather_facts: true

  pre_tasks:
    - name: Validate supported Fedora release
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Fedora"
          - ansible_facts.distribution_major_version == target_fedora_major_version
        fail_msg: >-
          Este playbook foi feito para Fedora {{ target_fedora_major_version }}.
          Sistema detectado: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.

    - name: Validate observability lab prerequisites
      ansible.builtin.assert:
        that:
          - install_docker_ce
        fail_msg: "O laboratorio de observabilidade exige install_docker_ce=true."
      when: install_observability_lab

  tasks:
    - name: Upgrade system packages  # noqa: package-latest
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
      become: true
      when: run_system_upgrade

    - name: Install base packages
      ansible.builtin.dnf:
        name: "{{ base_packages }}"
        state: present
        update_cache: true
      become: true

    - name: Install systems-study tooling
      ansible.builtin.dnf:
        name: "{{ study_foundation_packages }}"
        state: present
      become: true
      when: install_study_foundations

    - name: Install PostgreSQL client tooling
      ansible.builtin.dnf:
        name: "{{ database_packages }}"
        state: present
      become: true
      when: install_database_tooling

    - name: Install platform engineering tooling
      ansible.builtin.dnf:
        name: "{{ platform_packages }}"
        state: present
      become: true
      when: install_platform_tooling

    - name: Install quality tooling
      ansible.builtin.dnf:
        name: "{{ quality_packages }}"
        state: present
      become: true
      when: install_quality_tooling

    - name: Install security tooling
      ansible.builtin.dnf:
        name: "{{ security_packages }}"
        state: present
      become: true
      when: install_security_tooling

    - name: Install Flatpak for Gradia
      ansible.builtin.dnf:
        name: flatpak
        state: present
      become: true
      when: install_gradia

    - name: Add Flathub remote for Gradia
      community.general.flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: "{{ gradia_flathub_repo }}"
        method: user
      when: install_gradia

    - name: Install Gradia from Flathub
      community.general.flatpak:
        name: "{{ gradia_flatpak_id }}"
        state: present
        method: user
        remote: flathub
      when: install_gradia

    - name: Download DBeaver CE RPM
      ansible.builtin.get_url:
        url: "{{ dbeaver_rpm_url }}"
        dest: "{{ dbeaver_rpm_path }}"
        mode: "0644"
        checksum: "sha256:{{ dbeaver_rpm_sha256 }}"
      when: install_dbeaver

    - name: Install DBeaver CE
      # On Fedora 44, the Ansible dnf5 module can report failure after a
      # successful local-RPM transaction when its post-transaction D-Bus query
      # is denied by polkit. Calling DNF directly preserves its real exit code.
      ansible.builtin.command:
        argv:
          - dnf
          - install
          - --assumeyes
          - --nogpgcheck
          - "{{ dbeaver_rpm_path }}"
      become: true
      register: dbeaver_install
      changed_when: "'Nothing to do.' not in dbeaver_install.stdout"
      when: install_dbeaver

    - name: Create Obsidian application directory
      ansible.builtin.file:
        path: "{{ obsidian_appimage_dir }}"
        state: directory
        mode: "0755"
      when: install_obsidian

    - name: Download Obsidian AppImage
      ansible.builtin.get_url:
        url: "{{ obsidian_appimage_url }}"
        dest: "{{ obsidian_appimage_path }}"
        mode: "0755"
        checksum: "sha256:{{ obsidian_appimage_sha256 }}"
      when: install_obsidian

    - name: Create local binary directory
      ansible.builtin.file:
        path: "{{ obsidian_command_path | dirname }}"
        state: directory
        mode: "0755"
      when: install_obsidian

    - name: Create Obsidian command
      ansible.builtin.file:
        src: "{{ obsidian_appimage_path }}"
        dest: "{{ obsidian_command_path }}"
        state: link
      when: install_obsidian

    - name: Create Obsidian desktop entry directory
      ansible.builtin.file:
        path: "{{ obsidian_desktop_path | dirname }}"
        state: directory
        mode: "0755"
      when: install_obsidian

    - name: Create Obsidian desktop entry
      ansible.builtin.copy:
        dest: "{{ obsidian_desktop_path }}"
        mode: "0644"
        content: |
          [Desktop Entry]
          Name=Obsidian
          Comment=Knowledge base that works on local Markdown files
          Exec={{ obsidian_command_path }} %U
          Terminal=false
          Type=Application
          Categories=Office;Utility;
          MimeType=x-scheme-handler/obsidian;
          StartupWMClass=obsidian
      when: install_obsidian

    - name: Download ai-memory installer
      ansible.builtin.get_url:
        url: "{{ ai_memory_installer_url }}"
        dest: "{{ ai_memory_installer_path }}"
        mode: "0755"
        checksum: "sha256:{{ ai_memory_installer_sha256 }}"
      when: install_ai_memory

    - name: Install ai-memory
      ansible.builtin.command:
        argv:
          - sh
          - "{{ ai_memory_installer_path }}"
      environment:
        AI_MEMORY_VERSION: "{{ ai_memory_version }}"
        AI_MEMORY_BIN_DIR: "{{ ai_memory_bin_path | dirname }}"
        AI_MEMORY_LIB_DIR: "{{ dev_home }}/.local/lib/ai-memory"
      changed_when: false
      when: install_ai_memory

    - name: Initialise ai-memory data directory
      ansible.builtin.command:
        argv:
          - "{{ ai_memory_bin_path }}"
          - --data-dir
          - "{{ ai_memory_data_dir }}"
          - --config
          - "{{ ai_memory_config_path }}"
          - init
      args:
        creates: "{{ ai_memory_config_path }}"
      when: install_ai_memory

    - name: Configure ai-memory bind address
      ansible.builtin.lineinfile:
        path: "{{ ai_memory_config_path }}"
        regexp: '^bind\s*='
        line: 'bind = "{{ ai_memory_bind }}"'
      notify: Restart ai-memory service
      when: install_ai_memory

    - name: Configure ai-memory server URL
      ansible.builtin.lineinfile:
        path: "{{ ai_memory_config_path }}"
        regexp: '^server_url\s*='
        insertafter: '^bind\s*='
        line: 'server_url = "{{ ai_memory_server_url }}"'
      notify: Restart ai-memory service
      when: install_ai_memory

    - name: Set up ai-memory service and OpenCode integration
      ansible.builtin.command:
        argv:
          - "{{ ai_memory_bin_path }}"
          - --data-dir
          - "{{ ai_memory_data_dir }}"
          - --config
          - "{{ ai_memory_config_path }}"
          - setup
          - --yes
          - --agent
          - open-code
      changed_when: false
      when: install_ai_memory

    - name: Configure ai-memory OpenCode hooks with the selected port
      ansible.builtin.command:
        argv:
          - "{{ ai_memory_bin_path }}"
          - --data-dir
          - "{{ ai_memory_data_dir }}"
          - --config
          - "{{ ai_memory_config_path }}"
          - install-hooks
          - --agent
          - open-code
          - --server-url
          - "{{ ai_memory_server_url }}"
          - --apply
      changed_when: false
      when: install_ai_memory

    - name: Configure ai-memory OpenCode MCP server with the selected port
      ansible.builtin.command:
        argv:
          - "{{ ai_memory_bin_path }}"
          - --data-dir
          - "{{ ai_memory_data_dir }}"
          - --config
          - "{{ ai_memory_config_path }}"
          - install-mcp
          - --client
          - open-code
          - --server-url
          - "{{ ai_memory_server_url }}"
          - --apply
      changed_when: false
      when: install_ai_memory

    - name: Install pgModeler
      ansible.builtin.dnf:
        name: "{{ pgmodeler_package }}"
        state: present
      become: true

    - name: Install SRE packages
      ansible.builtin.dnf:
        name: "{{ sre_packages }}"
        state: present
      become: true

    - name: Check k9s binary
      ansible.builtin.stat:
        path: /usr/local/bin/k9s
      register: k9s_binary

    - name: Create temporary k9s extraction directory
      ansible.builtin.tempfile:
        state: directory
        suffix: k9s
      register: k9s_tempdir
      when: not k9s_binary.stat.exists

    - name: Download and extract k9s
      ansible.builtin.unarchive:
        src: "{{ k9s_archive_url }}"
        dest: "{{ k9s_tempdir.path }}"
        remote_src: true
      when: not k9s_binary.stat.exists

    - name: Install k9s binary
      ansible.builtin.copy:
        src: "{{ k9s_tempdir.path }}/k9s"
        dest: /usr/local/bin/k9s
        mode: "0755"
        remote_src: true
      become: true
      when: not k9s_binary.stat.exists

    - name: Download mise installer
      ansible.builtin.get_url:
        url: "{{ mise_installer_url }}"
        dest: "{{ mise_installer_path }}"
        mode: "0755"

    - name: Install mise
      ansible.builtin.command: "{{ mise_installer_path }}"
      args:
        creates: "{{ dev_home }}/.local/bin/mise"

    - name: Install runtimes with mise
      ansible.builtin.command: "{{ dev_home }}/.local/bin/mise use -g {{ item }}"
      environment:
        PATH: "{{ dev_home }}/.local/bin:{{ ansible_facts.env.PATH }}"
      loop: "{{ mise_tools }}"
      loop_control:
        label: "{{ item }}"
      register: mise_results
      changed_when: "'installed' in mise_results.stdout or 'updated' in mise_results.stdout or 'set' in mise_results.stdout"

    - name: Install platform tools with mise
      ansible.builtin.command: "{{ dev_home }}/.local/bin/mise use -g {{ item }}"
      environment:
        PATH: "{{ dev_home }}/.local/bin:{{ ansible_facts.env.PATH }}"
      loop: "{{ platform_mise_tools }}"
      loop_control:
        label: "{{ item }}"
      register: platform_mise_results
      changed_when: "'installed' in platform_mise_results.stdout or 'updated' in platform_mise_results.stdout or 'set' in platform_mise_results.stdout"
      when: install_platform_tooling

    - name: Install quality tools with mise
      ansible.builtin.command: "{{ dev_home }}/.local/bin/mise use -g {{ item }}"
      environment:
        PATH: "{{ dev_home }}/.local/bin:{{ ansible_facts.env.PATH }}"
      loop: "{{ quality_mise_tools }}"
      loop_control:
        label: "{{ item }}"
      register: quality_mise_results
      changed_when: "'installed' in quality_mise_results.stdout or 'updated' in quality_mise_results.stdout or 'set' in quality_mise_results.stdout"
      when: install_quality_tooling

    - name: Install security tools with mise
      ansible.builtin.command: "{{ dev_home }}/.local/bin/mise use -g {{ item }}"
      environment:
        PATH: "{{ dev_home }}/.local/bin:{{ ansible_facts.env.PATH }}"
      loop: "{{ security_mise_tools }}"
      loop_control:
        label: "{{ item }}"
      register: security_mise_results
      changed_when: "'installed' in security_mise_results.stdout or 'updated' in security_mise_results.stdout or 'set' in security_mise_results.stdout"
      when: install_security_tooling

    - name: Reshim mise tools
      ansible.builtin.command: "{{ dev_home }}/.local/bin/mise reshim"
      environment:
        PATH: "{{ dev_home }}/.local/bin:{{ ansible_facts.env.PATH }}"
      changed_when: false

    - name: Install pip and pipx for the selected Python
      ansible.builtin.command: "{{ dev_home }}/.local/share/mise/shims/python -m pip install --user --upgrade pip pipx"
      environment:
        PATH: "{{ dev_home }}/.local/share/mise/shims:{{ dev_home }}/.local/bin:{{ ansible_facts.env.PATH }}"
      register: pipx_bootstrap
      changed_when: "'Successfully installed' in pipx_bootstrap.stdout"

    - name: Ensure pipx path exists
      ansible.builtin.command: "{{ dev_home }}/.local/share/mise/shims/python -m pipx ensurepath"
      environment:
        PATH: "{{ dev_home }}/.local/share/mise/shims:{{ dev_home }}/.local/bin:{{ ansible_facts.env.PATH }}"
      changed_when: false

    - name: Install Python CLI tools with pipx
      ansible.builtin.command: "{{ dev_home }}/.local/bin/pipx install {{ item }}"
      args:
        creates: "{{ dev_home }}/.local/share/pipx/venvs/{{ item }}"
      environment:
        PATH: "{{ dev_home }}/.local/share/mise/shims:{{ dev_home }}/.local/bin:{{ ansible_facts.env.PATH }}"
      loop: "{{ python_cli_tools }}"
      loop_control:
        label: "{{ item }}"

    - name: Replace Podman stack before Docker CE install
      when: install_docker_ce and replace_podman_with_docker
      tags: podman_cleanup
      block:
        - name: Gather installed RPM packages before Podman replacement
          ansible.builtin.package_facts:
            manager: rpm

        - name: Select installed Podman stack packages
          ansible.builtin.set_fact:
            installed_podman_packages: "{{ podman_packages | intersect(ansible_facts.packages.keys() | list) | sort }}"

        - name: Check Podman socket unit before replacement
          # service_facts only lists services, not socket units.
          ansible.builtin.command:
            argv:
              - systemctl
              - show
              - --property=LoadState
              - --value
              - podman.socket
          register: podman_socket_load_state
          changed_when: false
          check_mode: false
          when: installed_podman_packages | length > 0

        - name: Disable podman socket before replacement
          ansible.builtin.systemd:
            name: podman.socket
            enabled: false
            state: stopped
          become: true
          when:
            - installed_podman_packages | length > 0
            - podman_socket_load_state.stdout | trim != 'not-found'

        - name: Remove Podman stack before Docker CE install
          ansible.builtin.dnf:
            name: "{{ installed_podman_packages }}"
            state: absent
            # DNF5 needs this to remove reverse dependencies such as toolbox.
            allowerasing: true
            # Do not perform a system-wide cleanup of unrelated orphan packages.
            autoremove: false
          become: true
          register: podman_removal
          when: installed_podman_packages | length > 0

        - name: Show Podman removal transaction
          ansible.builtin.debug:
            var: podman_removal.results
          when: installed_podman_packages | length > 0

        - name: Remove containers nodocker marker
          ansible.builtin.file:
            path: /etc/containers/nodocker
            state: absent
          become: true

    - name: Add Docker CE repository
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/fedora/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: "0644"
      become: true
      when: install_docker_ce

    - name: Install Docker CE packages
      ansible.builtin.dnf:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true
      become: true
      when: install_docker_ce

    - name: Enable Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
      become: true
      when: install_docker_ce

    - name: Create observability lab directory
      ansible.builtin.file:
        path: "{{ observability_lab_dir }}"
        state: directory
        mode: "0755"
      when: install_observability_lab

    - name: Configure observability lab
      ansible.builtin.copy:
        src: labs/observability/
        dest: "{{ observability_lab_dir }}/"
        mode: preserve
      when: install_observability_lab

    - name: Validate observability lab configuration
      ansible.builtin.command: docker compose config --quiet
      args:
        chdir: "{{ observability_lab_dir }}"
      changed_when: false
      when: install_observability_lab

    - name: Add developer user to docker group
      ansible.builtin.user:
        name: "{{ dev_user }}"
        groups: docker
        append: true
      become: true
      when: install_docker_ce

    - name: Ensure font directory exists
      ansible.builtin.file:
        path: "{{ dev_home }}/.local/share/fonts/JetBrainsMonoNF"
        state: directory
        mode: "0755"

    - name: Download JetBrains Mono Nerd Font
      ansible.builtin.get_url:
        url: "{{ jetbrains_mono_url }}"
        dest: "/tmp/JetBrainsMono-{{ jetbrains_mono_version }}.zip"
        mode: "0644"

    - name: Install JetBrains Mono Nerd Font
      ansible.builtin.unarchive:
        src: "/tmp/JetBrainsMono-{{ jetbrains_mono_version }}.zip"
        dest: "{{ dev_home }}/.local/share/fonts/JetBrainsMonoNF"
        remote_src: true
        creates: "{{ dev_home }}/.local/share/fonts/JetBrainsMonoNF/JetBrainsMonoNerdFont-Regular.ttf"
      notify: Rebuild font cache

    - name: Install Dracula GNOME dependencies
      ansible.builtin.dnf:
        name:
          - gtk-murrine-engine
          - gnome-shell-extension-user-theme
          - sassc
        state: present
      become: true
      when: configure_gnome

    - name: Ensure themes directory exists
      ansible.builtin.file:
        path: "{{ dev_home }}/.themes"
        state: directory
        mode: "0755"
      when: configure_gnome

    - name: Ensure GTK4 config directory exists
      ansible.builtin.file:
        path: "{{ dev_home }}/.config/gtk-4.0"
        state: directory
        mode: "0755"
      when: configure_gnome

    - name: Install Dracula GTK theme
      ansible.builtin.git:
        repo: https://github.com/dracula/gtk.git
        dest: "{{ dracula_theme_dir }}"
        depth: 1
        version: "{{ dracula_gtk_version }}"
        update: true
      when: configure_gnome

    - name: Apply Dracula GTK4 assets
      ansible.builtin.copy:
        src: "{{ dracula_theme_dir }}/assets"
        dest: "{{ dev_home }}/.config"
        mode: preserve
        remote_src: true
      when: configure_gnome

    - name: Apply Dracula GTK4 stylesheets
      ansible.builtin.copy:
        src: "{{ dracula_theme_dir }}/gtk-4.0/{{ item }}"
        dest: "{{ dev_home }}/.config/gtk-4.0/{{ item }}"
        mode: "0644"
        remote_src: true
      loop:
        - gtk.css
        - gtk-dark.css
      when: configure_gnome

    - name: Install icon theme package
      ansible.builtin.dnf:
        name: "{{ icon_theme_package }}"
        state: present
      become: true
      when: configure_gnome

    - name: Enable GNOME user theme extension
      ansible.builtin.command: gnome-extensions enable user-theme@gnome-shell-extensions.gcampax.github.com
      changed_when: false
      failed_when: false
      when: configure_gnome

    - name: Apply GNOME appearance settings
      community.general.dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
      loop:
        - key: /org/gnome/desktop/interface/gtk-theme
          value: "'Dracula'"
        - key: /org/gnome/desktop/wm/preferences/theme
          value: "'Dracula'"
        - key: /org/gnome/desktop/interface/icon-theme
          value: "'{{ icon_theme_name }}'"
        - key: /org/gnome/desktop/interface/color-scheme
          value: "'prefer-dark'"
        - key: /org/gnome/desktop/interface/monospace-font-name
          value: "'JetBrainsMono Nerd Font 11'"
        - key: /org/gnome/shell/extensions/user-theme/name
          value: "'Dracula'"
      loop_control:
        label: "{{ item.key }}"
      failed_when: false
      when: configure_gnome

    - name: Ensure Kitty config directory exists
      ansible.builtin.file:
        path: "{{ dev_home }}/.config/kitty"
        state: directory
        mode: "0755"
      when: configure_kitty

    - name: Configure Kitty
      ansible.builtin.template:
        src: templates/kitty.conf.j2
        dest: "{{ dev_home }}/.config/kitty/kitty.conf"
        mode: "0644"
        backup: true
      when: configure_kitty

    - name: Download Oh My Zsh installer
      ansible.builtin.get_url:
        url: "{{ oh_my_zsh_installer_url }}"
        dest: "{{ oh_my_zsh_installer_path }}"
        mode: "0755"
      when: configure_shell

    - name: Install Oh My Zsh
      ansible.builtin.command: "{{ oh_my_zsh_installer_path }}"
      args:
        creates: "{{ dev_home }}/.oh-my-zsh"
      environment:
        RUNZSH: "no"
        CHSH: "no"
        KEEP_ZSHRC: "yes"
      when: configure_shell

    - name: Ensure Oh My Zsh custom directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ zsh_custom_dir }}/plugins"
        - "{{ zsh_custom_dir }}/themes"
      loop_control:
        label: "{{ item }}"
      when: configure_shell

    - name: Install Zsh plugins and theme
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "{{ item.dest }}"
        depth: 1
        version: "{{ item.version | default(zsh_plugin_version) }}"
        update: true
      loop:
        - repo: https://github.com/zsh-users/zsh-autosuggestions
          dest: "{{ zsh_custom_dir }}/plugins/zsh-autosuggestions"
        - repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
          dest: "{{ zsh_custom_dir }}/plugins/zsh-syntax-highlighting"
        - repo: https://github.com/zsh-users/zsh-completions
          dest: "{{ zsh_custom_dir }}/plugins/zsh-completions"
        - repo: https://github.com/marlonrichert/zsh-autocomplete.git
          dest: "{{ zsh_custom_dir }}/plugins/zsh-autocomplete"
          version: main
        - repo: https://github.com/dracula/zsh.git
          dest: "{{ zsh_custom_dir }}/themes/dracula"
      loop_control:
        label: "{{ item.dest }}"
      when: configure_shell

    - name: Link Dracula Zsh theme
      ansible.builtin.file:
        src: "{{ zsh_custom_dir }}/themes/dracula/dracula.zsh-theme"
        dest: "{{ zsh_custom_dir }}/themes/dracula.zsh-theme"
        state: link
      when: configure_shell

    - name: Configure Zsh
      ansible.builtin.template:
        src: templates/zshrc.j2
        dest: "{{ dev_home }}/.zshrc"
        mode: "0644"
        backup: true
      when: configure_shell

    - name: Set Zsh as default shell
      ansible.builtin.user:
        name: "{{ dev_user }}"
        shell: /usr/bin/zsh
      become: true
      when: configure_shell

    - name: Check LazyVim target
      ansible.builtin.stat:
        path: "{{ lazyvim_dir }}"
      register: lazyvim_stat
      when: install_lazyvim

    - name: Check LazyVim git metadata
      ansible.builtin.stat:
        path: "{{ lazyvim_dir }}/.git"
      register: lazyvim_git_stat
      when:
        - install_lazyvim
        - lazyvim_stat.stat.exists

    - name: Stop before overwriting unmanaged Neovim config
      ansible.builtin.fail:
        msg: "{{ lazyvim_dir }} ja existe e nao e um repositorio Git. Faca backup/remova manualmente ou desative install_lazyvim."
      when:
        - install_lazyvim
        - lazyvim_stat.stat.exists
        - not lazyvim_git_stat.stat.exists

    - name: Install LazyVim starter
      ansible.builtin.git:
        repo: https://github.com/LazyVim/starter
        dest: "{{ lazyvim_dir }}"
        version: "{{ lazyvim_starter_version }}"
        update: false
      when: install_lazyvim

    - name: Ensure LazyVim plugins directory exists
      ansible.builtin.file:
        path: "{{ lazyvim_dir }}/lua/plugins"
        state: directory
        mode: "0755"
      when: install_lazyvim

    - name: Configure LazyVim language extras
      ansible.builtin.blockinfile:
        path: "{{ lazyvim_dir }}/lua/config/lazy.lua"
        insertafter: '^    \{ "LazyVim/LazyVim", import = "lazyvim\.plugins" \},$'
        marker: "    -- {mark} Ansible LazyVim extras"
        block: |2
              { import = "lazyvim.plugins.extras.lang.python" },
              { import = "lazyvim.plugins.extras.lang.dotnet" },
              { import = "lazyvim.plugins.extras.lang.go" },
              { import = "lazyvim.plugins.extras.lang.docker" },
              { import = "lazyvim.plugins.extras.lang.json" },
              { import = "lazyvim.plugins.extras.lang.markdown" },
              { import = "lazyvim.plugins.extras.lang.sql" },
              { import = "lazyvim.plugins.extras.lang.terraform" },
              { import = "lazyvim.plugins.extras.lang.yaml" },
              { import = "lazyvim.plugins.extras.dap.core" },
              { import = "lazyvim.plugins.extras.test.core" },
        backup: true
      when: install_lazyvim

    - name: Remove legacy LazyVim extras plugin file
      ansible.builtin.file:
        path: "{{ lazyvim_dir }}/lua/plugins/extras.lua"
        state: absent
      when: install_lazyvim

    - name: Sync LazyVim plugins
      ansible.builtin.command: nvim --headless '+Lazy! sync' +qa
      register: lazyvim_sync
      changed_when: false
      failed_when: false
      when: install_lazyvim

    - name: Configure GNOME shortcuts
      community.general.dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
      loop:
        - key: /org/gnome/desktop/wm/keybindings/switch-applications
          value: "['<Super>Tab']"
        - key: /org/gnome/desktop/wm/keybindings/switch-windows
          value: "['<Alt>Tab']"
        - key: /org/gnome/desktop/wm/keybindings/close
          value: "['<Super>q']"
        - key: /org/gnome/settings-daemon/plugins/media-keys/home
          value: "['<Super>e']"
        - key: /org/gnome/settings-daemon/plugins/media-keys/control-center
          value: "['<Super>i']"
        - key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings
          value: >-
            ['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/',
            '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/']
        - key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/name
          value: "'Terminal'"
        - key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/command
          value: "'kitty'"
        - key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/binding
          value: "'<Super>Return'"
        - key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/name
          value: "'Browser'"
        - key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/command
          value: "'xdg-open https://www.google.com'"
        - key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/binding
          value: "'<Super>b'"
      loop_control:
        label: "{{ item.key }}"
      failed_when: false
      when: configure_gnome

    - name: Configure Gradia interactive screenshot shortcut
      community.general.dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
      loop:
        - key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings
          value: >-
            ['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/',
            '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/',
            '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/']
        - key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/name
          value: "'Gradia interactive screenshot'"
        - key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/command
          value: "'flatpak run {{ gradia_flatpak_id }} --screenshot=INTERACTIVE'"
        - key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/binding
          value: "'<Super><Shift>s'"
      loop_control:
        label: "{{ item.key }}"
      failed_when: false
      when:
        - configure_gnome
        - install_gradia

  handlers:
    - name: Restart ai-memory service
      ansible.builtin.systemd_service:
        name: ai-memory.service
        scope: user
        state: restarted

    - name: Rebuild font cache
      ansible.builtin.command: "fc-cache -fv {{ dev_home }}/.local/share/fonts"
      changed_when: false

  post_tasks:
    - name: Print next steps
      ansible.builtin.debug:
        msg:
          - "Reinicie a sessao para aplicar shell, grupo docker, fonte e tema."
          - "Valide com: docker run hello-world; dotnet --info; python --version; uv --version; poetry --version; nvim"
