---
# Ajuste este arquivo antes de executar se quiser um setup mais conservador.
target_fedora_major_version: "44"

dev_user: "{{ ansible_facts.user_id }}"
dev_home: "{{ ansible_facts.env.HOME }}"

run_system_upgrade: true
install_docker_ce: true
replace_podman_with_docker: true
configure_gnome: true
configure_shell: true
configure_kitty: true
install_lazyvim: true
install_dbeaver: true
install_study_foundations: true
install_database_tooling: true
install_platform_tooling: true
install_quality_tooling: true
install_security_tooling: true
install_observability_lab: true
configure_direnv: true
k9s_archive_url: "https://github.com/derailed/k9s/releases/latest/download/k9s_Linux_amd64.tar.gz"

mise_tools:
  - dotnet@10.0.400
  - go@1.25.14
  - lazygit@0.55.1
  - node@24.20.0
  - python@3.14.7

platform_mise_tools:
  - kind@0.33.0
  - k6@2.3.0
  - kubeconform@0.8.0
  - kubectl@1.37.1
  - kubectx@0.11.0
  - stern@1.34.0

quality_mise_tools:
  - act@0.2.89
  - actionlint@1.7.12
  - vacuum@0.33.2

security_mise_tools:
  - syft@1.55.0

python_cli_tools:
  - ansible-lint
  - black
  - cookiecutter
  - httpie
  - ipython
  - mypy
  - poetry
  - pre-commit
  - ruff
  - uv

base_packages:
  - "@development-tools"
  - ShellCheck
  - bat
  - bzip2-devel
  - btop
  - ca-certificates
  - curl
  - dconf-editor
  - dnf-plugins-core
  - eza
  - fastfetch
  - fd-find
  - fzf
  - gcc
  - gcc-c++
  - git
  - gnome-extensions-app
  - gnome-tweaks
  - htop
  - jq
  - kitty
  - libffi-devel
  - make
  - neovim
  - openssl-devel
  - procps-ng
  - python3-psutil
  - readline-devel
  - ripgrep
  - sqlite
  - sqlite-devel
  - tar
  - tmux
  - tk-devel
  - unzip
  - util-linux-user
  - wget
  - which
  - xz-devel
  - zlib-devel
  - zsh

study_foundation_packages:
  - bind-utils
  - bpftrace
  - clang
  - cmake
  - direnv
  - gdb
  - iotop
  - iproute
  - just
  - lsof
  - mtr
  - ninja-build
  - nmap-ncat
  - perf
  - strace
  - sysstat
  - tcpdump
  - valgrind
  - wireshark-cli
  - yq

database_packages:
  - postgresql
  - postgresql-contrib

platform_packages:
  - kustomize
  - opentofu

quality_packages:
  - grpcurl
  - hadolint
  - yamllint

security_packages:
  - gitleaks
  - trivy

sre_packages:
  - ansible
  - helm

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Pacotes presentes sao removidos em uma transacao, junto com seus dependentes.
podman_packages:
  - podman
  - podman-docker
  - buildah
  - skopeo
  - containers-common
  - containers-common-extra
  - toolbox

pgmodeler_package: pgmodeler-1.2.2-2.fc44.x86_64

jetbrains_mono_version: "3.4.0"
jetbrains_mono_url: "https://github.com/ryanoasis/nerd-fonts/releases/download/v{{ jetbrains_mono_version }}/JetBrainsMono.zip"
mise_installer_url: https://mise.run
mise_installer_path: /tmp/mise-installer.sh
dracula_theme_dir: "{{ dev_home }}/.themes/Dracula"
dracula_gtk_version: master
icon_theme_package: candy-icon-theme
icon_theme_name: "Candy"
lazyvim_dir: "{{ dev_home }}/.config/nvim"
lazyvim_starter_version: main
observability_lab_dir: "{{ dev_home }}/labs/observability"
zsh_custom_dir: "{{ dev_home }}/.oh-my-zsh/custom"
oh_my_zsh_installer_url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
oh_my_zsh_installer_path: /tmp/oh-my-zsh-installer.sh
zsh_plugin_version: master
dbeaver_version: "26.2.0"
dbeaver_rpm_url: "https://github.com/dbeaver/dbeaver/releases/download/{{ dbeaver_version }}/dbeaver-ce-{{ dbeaver_version }}-linux-x86_64.rpm"
dbeaver_rpm_path: "/tmp/dbeaver-ce-{{ dbeaver_version }}-linux-x86_64.rpm"
dbeaver_rpm_sha256: acb3bc2fc2c3547df154f2bec20b5dc6b7941bd420ccb778de94e43e7170947e
